services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: minigame_feed
      POSTGRES_USER: minigame
      POSTGRES_PASSWORD: minigame
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minigame -d minigame_feed"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
